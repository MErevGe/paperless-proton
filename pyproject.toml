[tool.pip-tools]
allow-unsafe = true
generate-hashes = true
strip-extras = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["bridge_container/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["bridge_container"]
exclude = ["bridge_container/generated"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf.*", "waitress", "imapclient", "bridge_container.generated.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["bridge_container"]
omit = ["bridge_container/generated/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
