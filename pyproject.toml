[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["bridge_container"]

[tool.coverage.run]
branch = true
source = ["bridge_container"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == .__main__.:']
